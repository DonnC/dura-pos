# Maintained by the Dura POS contributors.
name: Main verification and release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dura-main-delivery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: sdk
        shell: pwsh
        run: Add-Content $env:GITHUB_OUTPUT "version=$(Get-Content .flutter-version)"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get --enforce-lockfile
      - run: dart run melos bootstrap
      - run: dart run melos run verify
      - run: dart run melos run generate
      - run: git diff --exit-code -- pubspec.lock packages/dura_data/lib/src/storage/local_database.g.dart
      - run: flutter build apk --debug
        working-directory: apps/dura
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-foundation-debug
          path: apps/dura/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: golden-failure-diffs
          path: '**/test/failures/**'
          if-no-files-found: ignore
  release:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: sdk
        shell: pwsh
        run: Add-Content $env:GITHUB_OUTPUT "version=$(Get-Content .flutter-version)"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/release.dart
        env:
          GH_TOKEN: ${{ github.token }}
          DURA_SIGNING_KEYSTORE_BASE64: ${{ secrets.DURA_SIGNING_KEYSTORE_BASE64 }}
          DURA_SIGNING_STORE_PASSWORD: ${{ secrets.DURA_SIGNING_STORE_PASSWORD }}
          DURA_SIGNING_KEY_ALIAS: ${{ secrets.DURA_SIGNING_KEY_ALIAS }}
          DURA_SIGNING_KEY_PASSWORD: ${{ secrets.DURA_SIGNING_KEY_PASSWORD }}
