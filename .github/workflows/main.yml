# Pull requests run verification only, with a read-only token. A push to main
# verifies again and then runs the release job, which publishes only when
# release.json declares release intent. See handbook/decisions/0004.
name: Verification and release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # One run per branch or PR. Superseded PR runs are cancelled; main runs are
  # serialized and never cancelled mid-publication.
  group: dura-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: sdk
        shell: pwsh
        run: Add-Content $env:GITHUB_OUTPUT "version=$(Get-Content .flutter-version)"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get --enforce-lockfile
      - run: dart run melos bootstrap
      - run: dart run melos run verify
      - run: dart run melos run generate
      - run: git diff --exit-code -- pubspec.lock packages/dura_data/lib/src/storage/local_database.g.dart
      - run: flutter build apk --debug
        working-directory: client/apps/dura
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-foundation-debug
          path: client/apps/dura/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: golden-failure-diffs
          path: '**/test/failures/**'
          if-no-files-found: ignore
  templates:
    # Uses the runner image's own Python, so no extra action is pinned.
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/templates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python --version
      - run: python ../../.agents/sync_skills.py --check
      - run: python -m pip install -r requirements.txt
      - run: python -m dura_templates verify
      - run: python -m dura_templates sample
      - run: python -m dura_templates check
      - run: python -m dura_templates excel
  hub:
    # Uses the runner image's own Node; the hub's tests need Node 22 or later.
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
  release:
    needs: [verify, templates, hub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: sdk
        shell: pwsh
        run: Add-Content $env:GITHUB_OUTPUT "version=$(Get-Content .flutter-version)"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/release.dart
        env:
          GH_TOKEN: ${{ github.token }}
          DURA_SIGNING_KEYSTORE_BASE64: ${{ secrets.DURA_SIGNING_KEYSTORE_BASE64 }}
          DURA_SIGNING_STORE_PASSWORD: ${{ secrets.DURA_SIGNING_STORE_PASSWORD }}
          DURA_SIGNING_KEY_ALIAS: ${{ secrets.DURA_SIGNING_KEY_ALIAS }}
          DURA_SIGNING_KEY_PASSWORD: ${{ secrets.DURA_SIGNING_KEY_PASSWORD }}
