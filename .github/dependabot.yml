# Maintained by the Dura POS contributors.
# Routine updates only; security updates are governed separately by GitHub.
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /apps/dura
      - /packages/dura_core
      - /packages/dura_data
      - /packages/dura_ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dart-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      dart-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'build(deps)'
  - package-ecosystem: gradle
    directories:
      - /apps/dura/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      android-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      android-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'build(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      actions-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'build(deps)'
