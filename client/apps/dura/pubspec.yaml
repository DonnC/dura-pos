version: 0.1.0-dev.2+2
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  dura_core: ^0.1.0-dev.2
  dura_data: ^0.1.0-dev.2
  dura_ui: ^0.1.0-dev.2
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  go_router: ^18.1.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: ^3.0.10

flutter:
  uses-material-design: true
  assets:
    - assets/branding/shop-sign-wordmark.svg
