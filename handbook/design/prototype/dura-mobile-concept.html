<div id="dura-concept" class="viz-dotted-background">
  <style>
    #dura-concept {color-scheme:light dark;--d-bg:light-dark(#f7f8f5,#171d1a);--d-paper:light-dark(#ffffff,#222a25);--d-ink:light-dark(#172b22,#eef5ef);--d-muted:light-dark(#52645b,#b3c4ba);--d-line:light-dark(#dce4dc,#3d4c42);--d-brand:light-dark(#176344,#91d7ad);--d-onbrand:light-dark(#ffffff,#102d1d);--d-soft:light-dark(#e9f3eb,#293e30);--d-warn:light-dark(#fff3dc,#43371e);--d-warnink:light-dark(#73500e,#ffdda0);--d-danger:light-dark(#a72d25,#ffb5aa);font-family:Roboto,"Segoe UI",sans-serif;color:var(--d-ink);padding:18px 0 26px;}
    #dura-concept *{box-sizing:border-box;}#dura-concept [hidden]{display:none!important;}
    #dura-concept .preview{max-width:390px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 4px;}
    #dura-concept .preview small{flex:1;color:var(--d-muted);font-size:11px;letter-spacing:.1em;}
    #dura-concept select,#dura-concept input{font:inherit;color:var(--d-ink);background:var(--d-paper);border:1px solid var(--d-line);border-radius:10px;padding:12px;min-width:0;max-width:100%;}
    #dura-concept .preview select{font-size:13px;padding:8px;min-height:44px;}
    #dura-concept .phone{max-width:390px;margin:auto;border:1px solid var(--d-line);border-radius:26px;background:var(--d-bg);overflow:hidden;box-shadow:0 12px 36px light-dark(#17302412,#00000022);}
    #dura-concept .system{padding:12px 22px 8px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;}
    #dura-concept .appbar{padding:15px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
    #dura-concept .wordmark{font-size:21px;font-weight:750;letter-spacing:-.7px;}#dura-concept .wordmark span{font-weight:400;color:var(--d-muted);}
    #dura-concept .shop{font-size:12px;color:var(--d-muted);margin-top:3px;}
    #dura-concept button{font:inherit;color:inherit;touch-action:manipulation;}
    #dura-concept .iconbutton{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--d-line);background:var(--d-paper);border-radius:12px;}
    #dura-concept .screen{padding:8px 20px 20px;min-height:575px;display:flex;flex-direction:column;gap:16px;}
    #dura-concept h2{font-size:26px;line-height:1.16;letter-spacing:-.7px;margin:0;font-weight:650;}#dura-concept h3{font-size:16px;margin:0;font-weight:650;}
    #dura-concept p{margin:0;line-height:1.5;}#dura-concept .muted{color:var(--d-muted);font-size:13px;line-height:1.5;}
    #dura-concept .eyebrow{font-size:11px;color:var(--d-brand);font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
    #dura-concept .line{display:flex;align-items:center;justify-content:space-between;gap:12px;}#dura-concept .line>*{min-width:0;}
    #dura-concept .stack{display:flex;flex-direction:column;gap:10px;}#dura-concept .grow{flex:1;}
    #dura-concept .status{background:var(--d-soft);color:var(--d-brand);padding:10px 12px;border-radius:10px;font-size:12px;display:flex;gap:8px;align-items:center;}
    #dura-concept .warning{background:var(--d-warn);color:var(--d-warnink);}
    #dura-concept .search{display:flex;gap:8px;}#dura-concept .search input{width:100%;font-size:14px;}
    #dura-concept .catalog{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    #dura-concept .product{background:var(--d-paper);border:1px solid var(--d-line);border-radius:15px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:9px;min-height:123px;position:relative;}
    #dura-concept .product .pict{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--d-soft);color:var(--d-brand);}
    #dura-concept .product strong{font-size:14px;font-weight:600;}#dura-concept .product .price{font-size:17px;font-weight:650;}
    #dura-concept .quantity{position:absolute;right:12px;top:12px;background:var(--d-brand);color:var(--d-onbrand);min-width:23px;height:23px;border-radius:20px;display:grid;place-items:center;font-size:12px;}
    #dura-concept .catalog.list{grid-template-columns:1fr;}#dura-concept .catalog.list .product{min-height:66px;display:grid;grid-template-columns:36px 1fr auto;align-items:center;padding:10px 13px;}#dura-concept .catalog.list .price{padding-right:22px;font-size:15px;}
    #dura-concept .primary,#dura-concept .secondary,#dura-concept .quiet{min-height:48px;padding:12px 16px;border-radius:12px;border:1px solid var(--d-line);font-size:14px;font-weight:600;background:var(--d-paper);text-align:center;}
    #dura-concept .primary{background:var(--d-brand);color:var(--d-onbrand);border-color:var(--d-brand);width:100%;display:flex;gap:10px;align-items:center;justify-content:center;}
    #dura-concept .primary:disabled{opacity:.5;}#dura-concept .quiet{border-color:transparent;background:transparent;color:var(--d-brand);}
    #dura-concept .checkoutbar{margin-top:auto;border-top:1px solid var(--d-line);padding-top:14px;display:flex;flex-direction:column;gap:12px;}
    #dura-concept .big{font-size:32px;letter-spacing:-1px;font-weight:650;font-variant-numeric:tabular-nums;}
    #dura-concept nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--d-line);background:var(--d-paper);padding:8px 8px 14px;gap:4px;}
    #dura-concept nav button{background:transparent;border:0;border-radius:12px;min-height:54px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;color:var(--d-muted);font-size:11px;}
    #dura-concept nav button[aria-current="page"]{background:var(--d-soft);color:var(--d-brand);font-weight:650;}
    #dura-concept .panel{border:1px solid var(--d-line);border-radius:15px;background:var(--d-paper);padding:16px;}
    #dura-concept .rule{border:0;border-top:1px solid var(--d-line);margin:3px 0;}
    #dura-concept .pair{display:flex;gap:8px;flex-wrap:wrap;}#dura-concept .pair>*{flex:1;}
    #dura-concept .pill{border:1px solid var(--d-line);background:var(--d-paper);padding:10px 12px;min-height:44px;border-radius:10px;font-size:13px;}
    #dura-concept .pill[aria-pressed="true"]{background:var(--d-soft);border-color:var(--d-brand);color:var(--d-brand);}
    #dura-concept label{font-size:13px;display:flex;flex-direction:column;gap:7px;font-weight:550;}
    #dura-concept .received{font-size:25px;font-variant-numeric:tabular-nums;width:100%;}
    #dura-concept .error{color:var(--d-danger);font-size:13px;min-height:19px;}
    #dura-concept .receipt{text-align:center;padding:24px 16px;background:var(--d-paper);border:1px solid var(--d-line);border-radius:15px;}
    #dura-concept .successmark{margin:0 auto 16px;width:58px;height:58px;border-radius:50%;background:var(--d-soft);color:var(--d-brand);display:grid;place-items:center;}
    #dura-concept .record{padding:13px 0;border-bottom:1px solid var(--d-line);font-size:14px;}.record strong{font-weight:600;}
    #dura-concept .tablewrap{max-width:100%;overflow:auto;}#dura-concept table{border-collapse:collapse;width:100%;font-size:12px;}
    #dura-concept th,#dura-concept td{padding:10px 6px;text-align:left;border-bottom:1px solid var(--d-line);}#dura-concept th{color:var(--d-muted);font-weight:500;}
    #dura-concept .footnote{font-size:11px;text-align:center;color:var(--d-muted);line-height:1.5;}
    #dura-concept .toast{font-size:12px;color:var(--d-brand);line-height:1.5;min-height:18px;}
    #dura-concept .intro{padding-top:25px;}#dura-concept .intro h2{font-size:34px;max-width:280px;}
    #dura-concept .tilelink{background:var(--d-paper);border:1px solid var(--d-line);border-radius:12px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;min-height:65px;font-size:14px;}
    #dura-concept .tilelink i{color:var(--d-brand);}#dura-concept .endnote{max-width:390px;margin:12px auto 0;padding:0 6px;color:var(--d-muted);font-size:12px;line-height:1.5;}
    @media(max-width:380px){#dura-concept .screen{padding:8px 14px 18px;}#dura-concept .appbar{padding-left:14px;padding-right:14px;}#dura-concept .phone{border-radius:19px;}#dura-concept .product{padding:11px;}}
  </style>
  <div class="preview"><small>INTERACTIVE CONCEPT · DEMO DATA</small><select id="dura-scene" aria-label="Preview a screen"><option value="sell">Sell</option><option value="welcome">First launch</option><option value="setup">Quick setup</option><option value="stock">Stock</option><option value="money">Cash-up</option><option value="shop">My records</option></select></div>
  <section class="phone" aria-label="Dura POS mobile concept">
    <div class="system"><span>09:41</span><span>4G &nbsp; ▰ 82%</span></div>
    <header class="appbar"><div><div class="wordmark">dura<span>pos</span></div><div class="shop" id="dura-shopname">Chipo's Shop · Front counter</div></div><button class="iconbutton cursor-interaction" data-go="shop" aria-label="Business records"><i data-lucide="store" aria-hidden="true"></i></button></header>
    <main id="dura-screen" class="screen"></main>
    <nav aria-label="Main navigation"><button data-go="sell" class="cursor-interaction"><i data-lucide="shopping-basket" aria-hidden="true"></i>Sell</button><button data-go="stock" class="cursor-interaction"><i data-lucide="package" aria-hidden="true"></i>Stock</button><button data-go="money" class="cursor-interaction"><i data-lucide="wallet" aria-hidden="true"></i>Money</button><button data-go="shop" class="cursor-interaction"><i data-lucide="folder-open" aria-hidden="true"></i>My shop</button></nav>
  </section>
  <div class="endnote" id="dura-caption">Tap products to build a sale, then take a cash payment. Every amount is sample data.</div>
  <script>
  (()=>{
    const root=document.getElementById('dura-concept'),screen=root.querySelector('#dura-screen'),picker=root.querySelector('#dura-scene');
    const design={catalog:'Tiles',offline:false};
    const products=[{id:'bread',name:'Bread loaf',unit:'loaf',price:100,stock:18,icon:'sandwich'},{id:'oil',name:'Cooking oil 2 L',unit:'bottle',price:450,stock:12,icon:'milk'},{id:'sugar',name:'Sugar 2 kg',unit:'pack',price:250,stock:9,icon:'package'},{id:'maize',name:'Mealie meal 5 kg',unit:'bag',price:380,stock:24,icon:'shopping-bag'}];
    let scene='sell',cart={},method='cash',received='',query='',name="Chipo's Shop",currency='USD',setupCurrency='',receipt=null,completed=0,lastCash=0,counted='',cashSaved=false;
    const money=n=>`${currency} ${(n/100).toFixed(2)}`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const total=()=>products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0),units=()=>Object.values(cart).reduce((s,v)=>s+v,0),icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
    const status=()=>`<div class="status ${design.offline?'warning':''}">${icon(design.offline?'cloud-off':'cloud-check')}<span>${design.offline?'Offline · sales stay on this phone':'Demo Drive connected · uploaded at 09:40'}</span></div>`;
    function go(next){scene=next;query='';render();}
    function render(){
      root.querySelector('#dura-shopname').textContent=name+' · Front counter';
      if([...picker.options].some(o=>o.value===scene))picker.value=scene;
      root.querySelector('nav').hidden=['welcome','setup','pay','success','file','export'].includes(scene);
      root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===scene?'page':'false'));
      let h='';
      if(scene==='sell')h=`${status()}<div class="line"><h2>New sale</h2><span class="eyebrow">${currency}</span></div><div class="search"><input id="dura-search" type="search" placeholder="Search products" aria-label="Search products" value="${esc(query)}"><button class="iconbutton cursor-interaction" data-action="scan" aria-label="Try barcode scanner">${icon('scan-barcode')}</button></div><div id="dura-products" class="catalog ${design.catalog==='List'?'list':''}">${productMarkup()}</div><button class="quiet cursor-interaction" data-action="custom">+ Enter an amount</button><div class="checkoutbar"><div class="line"><span class="muted">${units()} item${units()===1?'':'s'} in this sale</span><button class="quiet cursor-interaction" data-action="clear" ${units()?'':'disabled'}>Clear</button></div><button class="primary cursor-interaction" data-go="pay" ${units()?'':'disabled'}><span>Charge ${money(total())}</span>${icon('arrow-right')}</button><p class="footnote">Sample non-VAT business · no fiscal device configured</p></div>`;
      if(scene==='pay')h=`<button class="quiet cursor-interaction" data-go="sell" style="align-self:flex-start">← Back to sale</button><div><p class="muted">${units()} items · Amount to pay</p><div class="big">${money(total())}</div></div><div class="panel stack">${products.filter(p=>cart[p.id]).map(p=>`<div class="line"><span>${cart[p.id]} × ${esc(p.name)}</span><strong>${money(p.price*cart[p.id])}</strong></div>`).join('')}</div><h3>How is the customer paying?</h3><div class="pair"><button class="pill cursor-interaction" data-method="cash" aria-pressed="${method==='cash'}">Cash</button><button class="pill cursor-interaction" data-method="mobile" aria-pressed="${method==='mobile'}">Mobile money</button></div>${method==='cash'?`<label>Cash received (${currency})<input class="received" id="dura-received" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(received)}" placeholder="0.00"></label><div class="pair"><button class="pill cursor-interaction" data-cash="${(total()/100).toFixed(2)}">Exact amount</button><button class="pill cursor-interaction" data-cash="${(Math.ceil(total()/500)*5).toFixed(2)}">${money(Math.ceil(total()/500)*500)}</button></div><div class="status"><span>Change to give</span><strong id="dura-change" style="margin-left:auto">${money(Math.max(0,Math.round(Number(received)*100)-total()))}</strong></div><div id="dura-error" class="error" role="alert"></div><button class="primary cursor-interaction" data-action="complete">Complete cash sale</button>`:`<div class="status warning">Demo only · no merchant account connected</div><button class="tilelink cursor-interaction" data-action="gateway">${icon('smartphone')}<span>Connect Paynow<span class="muted" style="display:block">Owner setup · credentials stay private</span></span></button><button class="tilelink cursor-interaction" data-action="gateway">${icon('smartphone')}<span>Connect ZB Smile&amp;Pay<span class="muted" style="display:block">Verify payment before completing a sale</span></span></button><p class="muted">A payment timeout stays “Unconfirmed”. Recheck the same reference before asking the customer to pay again.</p>`}<p class="toast" aria-live="polite"></p>`;
      if(scene==='success')h=`<div class="receipt"><div class="successmark">${icon('check')}</div><p class="eyebrow">DEMO SALE</p><h2 style="margin:10px 0">Sale saved</h2><div class="big">${money(receipt.total)}</div><p class="muted">${receipt.id} · Cash</p><hr class="rule" style="margin:20px 0"><div class="line"><span>Cash received</span><strong>${money(receipt.received)}</strong></div><div class="line" style="margin-top:13px"><span>Change to give</span><strong>${money(receipt.received-receipt.total)}</strong></div></div><div class="status ${design.offline?'warning':''}">${icon(design.offline?'cloud-off':'hard-drive')}<span>Saved in this demo · ${design.offline?'would upload when connected':'no real data was uploaded'}</span></div><div class="pair"><button class="secondary cursor-interaction" data-action="receipt">Receipt preview</button><button class="secondary cursor-interaction" data-action="print">Print</button></div><p class="toast" aria-live="polite"></p><div class="grow"></div><button class="primary cursor-interaction" data-action="next">Start next sale ${icon('arrow-right')}</button><p class="footnote">Demonstration only · not a fiscal receipt</p>`;
      if(scene==='stock')h=`<div><p class="eyebrow">Main shop</p><h2 style="margin-top:5px">Stock</h2></div><p class="muted">Sample opening stock, adjusted for sales made in this preview.</p><div class="stack">${products.map(p=>`<div class="record line"><div><strong>${p.name}</strong><p class="muted">${money(p.price)} / ${p.unit}</p></div><div style="text-align:right"><strong>${p.stock} ${p.stock===1?p.unit:(p.unit==='loaf'?'loaves':p.unit+'s')}</strong><p class="muted" ${p.stock<20?'style="color:var(--d-warnink)"':''}>${p.stock<20?'Low · below 20':'In stock'}</p></div></div>`).join('')}</div><div class="grow"></div><button class="primary cursor-interaction" data-action="receive">${icon('package-plus')}Receive stock</button><p class="toast" aria-live="polite"></p>`;
      if(scene==='money'){let expected=4700+lastCash;h=`<div><p class="eyebrow">Today · Front counter</p><h2 style="margin-top:5px">Close your day</h2></div><div class="panel stack"><div class="line"><span>Opening float</span><strong>${money(1000)}</strong></div><div class="line"><span>Net cash sales</span><strong>${money(4000+lastCash)}</strong></div><div class="line"><span>Cash expenses</span><strong>− ${money(300)}</strong></div><hr class="rule"><div class="line"><strong>Cash expected</strong><strong>${money(expected)}</strong></div></div><label>Cash you counted (${currency})<input id="dura-counted" class="received" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="${esc(counted)}"></label><div class="line"><span>Difference</span><strong id="dura-difference">${counted===''?'Enter your count':money(Math.round(Number(counted)*100)-expected)}</strong></div><div class="status warning">Count cash only. Mobile payments are recorded separately.</div><div id="dura-casherror" class="error" role="alert"></div><div class="grow"></div><button class="primary cursor-interaction" data-action="cashup">${cashSaved?'Cash-up saved in preview':'Save cash-up'}</button><p class="toast" aria-live="polite"></p>`;}
      if(scene==='shop')h=`<div><p class="eyebrow">Your business, your records</p><h2 style="margin-top:5px">My shop</h2></div>${status()}<button class="tilelink cursor-interaction" data-go="file">${icon('sheet')}<span>October records<span class="muted" style="display:block">Preview the data your accountant sees</span></span></button><button class="tilelink cursor-interaction" data-go="export">${icon('download')}<span>Export your records<span class="muted" style="display:block">Excel, CSV or a complete archive</span></span></button><div class="panel stack"><div class="line"><span>Record storage</span><strong>Demo Drive</strong></div><div class="line"><span>Fiscal setup</span><span class="muted">Not configured</span></div><div class="line"><span>Payment gateways</span><span class="muted">Not connected</span></div></div><button class="quiet cursor-interaction" data-go="welcome">Preview first-time setup</button><p class="footnote">Prototype · no account is connected and no files leave this preview.</p>`;
      if(scene==='file')h=`<button class="quiet cursor-interaction" data-go="shop" style="align-self:flex-start">← My shop</button><div><p class="eyebrow">Data preview · October 2026</p><h2 style="margin-top:5px">Sales records</h2></div><p class="muted">All amounts below are in ${currency}. Sample rows; this is not a live spreadsheet.</p><div class="tablewrap"><table><thead><tr><th>Sale ID</th><th>Payment</th><th>Total (${currency})</th></tr></thead><tbody><tr><td>P1-S000030</td><td>Cash</td><td>2.00</td></tr>${receipt?`<tr><td>${receipt.id}</td><td>Cash</td><td>${(receipt.total/100).toFixed(2)}</td></tr>`:''}</tbody></table></div><div class="panel stack"><h3>Read me</h3><p class="muted">Sale ID links a sale to its items and payments. Total is the amount charged. Cash received and change appear in Payments.</p><p class="muted">Original records stay available. Corrections are linked adjustments.</p></div><button class="primary cursor-interaction" data-go="export">Preview an export ${icon('arrow-right')}</button>`;
      if(scene==='export')h=`<button class="quiet cursor-interaction" data-go="shop" style="align-self:flex-start">← My shop</button><div><p class="eyebrow">Take your data with you</p><h2 style="margin-top:5px">Export records</h2></div><label>Period<select><option>October 2026</option></select></label><div class="panel stack"><h3>Export preview</h3><p class="muted">Products, sales, items, payments, stock movements and cash-ups. Includes a Read Me and column descriptions.</p><div class="status warning">Provisional · October is still in progress</div></div><button class="tilelink cursor-interaction" data-action="export">${icon('sheet')}<span>Excel workbook<span class="muted" style="display:block">For you and your accountant</span></span></button><button class="tilelink cursor-interaction" data-action="export">${icon('files')}<span>CSV tables<span class="muted" style="display:block">Import into another system</span></span></button><button class="tilelink cursor-interaction" data-action="export">${icon('archive')}<span>Complete business archive<span class="muted" style="display:block">Journal, documents and readable records</span></span></button><p class="toast" aria-live="polite"></p>`;
      if(scene==='welcome')h=`<div class="intro stack"><p class="eyebrow">Made for your everyday business</p><h2>Your shop.<br>Your records.<br>Your control.</h2><p class="muted">Sell from your phone. Keep your records. Take them with you whenever you need.</p></div><div class="panel stack"><div class="line"><span>Core POS</span><strong>Free</strong></div><div class="line"><span>Sell without internet</span>${icon('check')}</div><div class="line"><span>Excel &amp; CSV exports</span>${icon('check')}</div></div><div class="grow"></div><button class="primary cursor-interaction" data-go="setup">Set up my shop ${icon('arrow-right')}</button><button class="secondary cursor-interaction" data-go="sell">Try the practice shop</button><p class="footnote">This preview uses practice data. Real fiscal and merchant setup are separate steps.</p>`;
      if(scene==='setup')h=`<p class="eyebrow">Quick-start preview</p><h2>Let's name your shop</h2><p class="muted">Start small. Add stock, a printer and payments when you're ready.</p><label>Shop name<input id="dura-name" value="${esc(name)}" autocomplete="organization"></label><label>What currency do you price in?<select id="dura-currency"><option value="">Choose your currency</option>${['USD','ZWG','ZAR'].map(c=>`<option ${setupCurrency===c?'selected':''}>${c}</option>`).join('')}</select></label><div class="status">Your prices use this currency. Other accepted currencies can be added later.</div><div id="dura-setuperror" class="error" role="alert"></div><div class="grow"></div><button class="primary cursor-interaction" data-action="setup">Continue to practice selling ${icon('arrow-right')}</button><p class="footnote">Preview skips PIN and Google authorisation. Live onboarding must include access protection and fiscal-readiness checks.</p>`;
      screen.innerHTML=h;
      root.querySelector('#dura-caption').textContent=({sell:'Tap products, charge the sale, and enter cash received. Amounts and stock update locally in this preview.',pay:'One clear payment action. Gateway setup is separate; this prototype cannot charge money.',money:'Count the drawer, see the difference, then save. Mobile money never inflates cash in hand.',shop:'Your records stay visible and portable. Preview the tables before exporting.',welcome:'A short introduction, with an immediate practice option.',setup:'No preselected pricing currency. This is a quick-start design sketch, not the full onboarding.',success:'A saved-sale confirmation prioritises change and the next customer.',stock:'Readable quantities and selling units. Stock updates when you finish a demo sale.',file:'Plain column names and currency labels make files understandable outside Dura.',export:'Preview contents and completeness before sharing records.'})[scene]||'';
      if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});
    }
    function productMarkup(){const found=products.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));return found.map(p=>`<button class="product cursor-interaction" data-product="${p.id}" aria-label="Add ${p.name}, ${money(p.price)}"><span class="pict">${icon(p.icon)}</span><strong>${p.name}</strong><span class="price">${money(p.price)}</span>${cart[p.id]?`<span class="quantity">${cart[p.id]}</span>`:''}</button>`).join('')||'<p class="muted">No matching products.</p>';}
    function toast(t){const e=screen.querySelector('.toast');if(e)e.textContent=t;}
    picker.addEventListener('change',()=>go(picker.value));
    root.addEventListener('input',e=>{
      if(e.target.id==='dura-search'){query=e.target.value;root.querySelector('#dura-products').innerHTML=productMarkup();if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});}
      if(e.target.id==='dura-received'){received=e.target.value;root.querySelector('#dura-change').textContent=money(Math.max(0,Math.round(Number(received)*100)-total()));root.querySelector('#dura-error').textContent='';}
      if(e.target.id==='dura-counted'){counted=e.target.value;root.querySelector('#dura-difference').textContent=counted===''?'Enter your count':money(Math.round(Number(counted)*100)-(4700+lastCash));cashSaved=false;}
      if(e.target.id==='dura-name')name=e.target.value;
      if(e.target.id==='dura-currency')setupCurrency=e.target.value;
    });
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.go){if(b.dataset.go==='pay'){method='cash';received='';}go(b.dataset.go);return;}
      if(b.dataset.product){cart[b.dataset.product]=(cart[b.dataset.product]||0)+1;render();return;}
      if(b.dataset.method){method=b.dataset.method;render();return;}
      if(b.dataset.cash){received=b.dataset.cash;render();return;}
      switch(b.dataset.action){
        case'clear':cart={};render();break;
        case'complete':{const cents=Math.round(Number(received)*100);if(received===''||!Number.isFinite(cents)||cents<total()){root.querySelector('#dura-error').textContent='Enter cash received, at least '+money(total())+'.';return;}receipt={id:'P1-S'+String(31+completed).padStart(6,'0'),total:total(),received:cents};products.forEach(p=>p.stock-=cart[p.id]||0);lastCash+=total();completed++;go('success');break;}
        case'next':cart={};received='';go('sell');break;
        case'cashup':if(counted===''||Number(counted)<0||!Number.isFinite(Number(counted))){root.querySelector('#dura-casherror').textContent='Enter the cash you counted.';}else{cashSaved=true;render();toast('Saved in this preview. A real cash-up would also record any difference and its explanation.');}break;
        case'setup':if(!name.trim()||!setupCurrency){root.querySelector('#dura-setuperror').textContent='Enter your shop name and choose a pricing currency.';}else{currency=setupCurrency;cart={};lastCash=0;go('sell');}break;
        case'export':toast('Export preview only. No file has been generated or shared.');break;
        case'gateway':toast('Owner setup would connect the business’s merchant account. No connection is made in this preview.');break;
        case'print':toast('Print preview only. A printer would be paired separately.');break;
        case'receipt':toast('DEMO '+receipt.id+' · '+money(receipt.total)+' · Cash · Not a fiscal receipt.');break;
        case'receive':toast('Receiving preview: choose supplier → enter product quantities and cost → review → save.');break;
        case'scan':root.querySelector('#dura-search').value='Bread';query='Bread';root.querySelector('#dura-products').innerHTML=productMarkup();if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});break;
        case'custom':{const container=document.createElement('div');container.className='panel stack';container.innerHTML='<label>Quick amount (demo only)<input id="dura-quick" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"></label><p class="muted">Production quick sales need a description and applicable tax treatment. This preview does not post quick amounts.</p>';b.replaceWith(container);break;}
      }
    });
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.phone'),onChange:render});tweak.addSelect(design,'catalog',{label:'Product layout',options:['Tiles','List']});tweak.addToggle(design,'offline',{label:'Show offline state'});}
  })();
  </script>
</div>
