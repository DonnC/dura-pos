<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dura · Counter concept</title>
  <link rel="stylesheet" href="-cdx-counter.css">
</head>
<body>
  <div class="app" id="app">
    <div class="system"><span>09:41</span><span>▴ &nbsp; ▰ 82%</span></div>
    <header class="appbar">
      <div class="identity"><img class="brand-logo"
        src="../../../../client/apps/dura/assets/branding/shop-sign-wordmark.svg" alt="Dura">
        <div><strong>Chipo’s corner shop</strong><small>Front counter · Practice shop</small></div>
      </div>
      <button class="avatar" data-action="shop" aria-label="Open My shop">C</button>
    </header>
    <button class="connection" id="connection" data-action="connection"></button>
    <main id="screen"></main>
    <div id="dock"></div>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="gesture" aria-hidden="true"><span></span></div>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="-cdx-art.js"></script>
  <script src="-cdx-state.js"></script>
  <script src="-cdx-selling.js"></script>
  <script src="-cdx-stock.js"></script>
  <script src="-cdx-money.js"></script>
  <script src="-cdx-shift.js"></script>
  <script src="-cdx-receipts.js"></script>
  <script src="-cdx-shop.js"></script>
  <script src="-cdx-onboarding.js"></script>
  <script src="-cdx-counter.js"></script>
</body>
</html>
