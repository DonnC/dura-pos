      <rect y="36" width="28" height="28" rx="7" fill="#e0ae4b"/><rect x="36" y="36" width="28" height="28" rx="7" fill="#024d39"/>

  <text class="title" x="60" y="72">Your shop. Your Google account. Your records.</text>
  <text class="sub" x="60" y="110">How Dura POS works: free, and built on what you already have.</text>

  <!-- links -->

  <path id="l-excel" class="link" d="M1010 382 H1192"/>
  <path id="l-apps" class="link" d="M1010 434 C1090 434 1090 536 1192 536"/>
  <path id="l-pay" class="link" d="M300 470 V680 H432"/>

  <!-- phone -->

    <rect x="130" y="196" width="170" height="306" rx="28" fill="#024d39" filter="url(#soft)"/>
    <rect x="144" y="214" width="142" height="262" rx="12" fill="#fefef8"/>

    <rect x="158" y="368" width="114" height="32" rx="8" fill="#e8f1ec"/>
    <text x="215" y="390" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#024d39">Sale saved</text>
    <rect x="158" y="410" width="114" height="10" rx="5" fill="#e6e8df"/><rect x="158" y="428" width="80" height="10" rx="5" fill="#e6e8df"/>

    <text class="note" x="215" y="568" text-anchor="middle">Sells offline</text>

    <text class="panel-title" x="520" y="226">Your own free Google account</text>
    <rect x="520" y="240" width="364" height="34" rx="17" fill="#e8f1ec"/>
    <text class="chip" x="702" y="263" text-anchor="middle">15 GB free · the one you already have</text>
    <rect x="456" y="350" width="44" height="64" rx="10" fill="#024d39"/>
    <text x="478" y="388" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#e0ae4b">D</text>
    <text class="small" x="478" y="440" text-anchor="middle">Dura helper</text>
  </g>
  <path id="l-phone" class="link" d="M300 382 H456"/>
  <path id="l-drive" class="link" d="M500 382 H590"/>
  <path id="l-sheets" class="link" d="M736 382 H868"/>
  <g id="s-drive">

    <text class="name" x="664" y="480" text-anchor="middle">Google Drive</text>
    <text class="note" x="664" y="508" text-anchor="middle">Where your records live</text>

  <g id="s-sheets">

    <text class="note" x="924" y="508" text-anchor="middle">Records you can read</text>
    <text class="note" x="924" y="533" text-anchor="middle">and edit yourself</text>
  </g>

  <!-- yours to use -->

    <text class="note" x="1290" y="250">with your accountant</text>
  </g>
  <g id="s-excel">
    <use href="#excel" x="1200" y="346" width="74" height="68"/>
    <text class="name" x="1290" y="374">Open in Microsoft Excel</text>
    <text class="note" x="1290" y="402">or download a copy</text>
  </g>
  <g id="s-apps">

    <text class="name" x="1290" y="530">Use any other app</text>
    <text class="note" x="1290" y="558">Your files go where you go</text>
  </g>

  <!-- payments -->
  <g id="s-pay">
    <rect x="434" y="608" width="1106" height="130" rx="24" fill="#fff" stroke="#dfe3dc" stroke-width="3" filter="url(#soft)"/>
    <text class="panel-title" x="466" y="654">Your payments, your merchant account</text>
    <text class="note" x="466" y="688">Mobile money goes straight to you, never through Dura.</text>
    <g transform="translate(1040 642)">
      <rect width="104" height="38" rx="19" fill="#e8f1ec"/><text class="chip" x="52" y="25" text-anchor="middle">EcoCash</text>
      <rect x="114" width="118" height="38" rx="19" fill="#e8f1ec"/><text class="chip" x="173" y="25" text-anchor="middle">OneMoney</text>
      <rect x="242" width="104" height="38" rx="19" fill="#e8f1ec"/><text class="chip" x="294" y="25" text-anchor="middle">InnBucks</text>
      <rect x="0" y="-12" width="0" height="0"/>
    </g>
    <rect x="1040" y="690" width="346" height="0"/>
    <text class="small" x="1040" y="708">through Paynow, with your own keys</text>
  </g>

  <!-- caption -->
  <rect x="0" y="762" width="1600" height="82" fill="#024d39"/>
  <text id="caption" class="caption" x="800" y="813" text-anchor="middle"></text>
  <text class="small" x="60" y="876">Free and open source. All product names and logos belong to their owners. Dura POS isn't affiliated with Google, Microsoft or the payment providers.</text>

  <circle id="dot" r="11" fill="#e0ae4b" stroke="#fff" stroke-width="3" opacity="0"/>
</svg>
<script>
  // One timeline, drawn by seek(t), so the same page plays live and renders frames.
  const LENGTH = 22;
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (v) => v * v * (3 - 2 * v);
  const el = (id) => document.getElementById(id);
  const CAPTIONS = [
    [0, 'A sale happens on your phone, even with no signal.'],
    [3, 'When there is signal, it goes to your own Google account. Not ours.'],
    [6.5, 'Your records live in your Google Drive.'],
    [9.5, 'They appear as spreadsheets you can read and edit.'],
    [12.5, 'Share them, or open them in Excel. They are your files.'],
    [15.5, 'Mobile money goes straight to your own merchant account.'],
    [18.5, 'Free to use. Your data. Your money.'],
  ];
  const ENTER = { 's-phone': 0.2, 's-account': 3, 's-drive': 6.5, 's-sheets': 9.5, 's-share': 12.5, 's-excel': 13.3, 's-apps': 14.1, 's-pay': 15.5 };
  const TRIPS = [
    ['l-phone', 1.8, 3.1], ['l-drive', 5.2, 6.5], ['l-sheets', 8.2, 9.5],
    ['l-share', 11.6, 12.5], ['l-excel', 12.4, 13.3], ['l-apps', 13.2, 14.1], ['l-pay', 14.6, 15.5],
  ];

  function seek(t) {
    for (const [id, at] of Object.entries(ENTER)) {
      const show = ease(clamp((t - at) / 0.7));
      el(id).style.opacity = 0.14 + 0.86 * show;
      el(id).style.transform = `translateY(${(1 - show) * 10}px)`;
    }
    el('account-box').style.stroke = t > 3 && t < 6.2 ? '#e0ae4b' : '#dfe3dc';
    let moving = null;
    for (const [id, from, to] of TRIPS) {
      el(id).classList.toggle('on', t >= from);
      if (t >= from && t < to) moving = [id, ease((t - from) / (to - from))];
    }
    const dot = el('dot');
    dot.setAttribute('opacity', moving ? 1 : 0);
    if (moving) {
      const path = el(moving[0]);
      const point = path.getPointAtLength(path.getTotalLength() * moving[1]);
      dot.setAttribute('cx', point.x);
      dot.setAttribute('cy', point.y);
    }
    const line = CAPTIONS.filter(([at]) => t >= at).pop();
    const caption = el('caption');
    caption.textContent = line[1];
    caption.style.opacity = ease(clamp((t - line[0]) / 0.4));
  }

  if (new URLSearchParams(location.search).has('capture')) {
    seek(LENGTH - 0.01);
  } else {
    const start = performance.now();
    (function tick(now) {
      seek(((now - start) / 1000) % LENGTH);
      requestAnimationFrame(tick);
    })(start);
  }
</script>
</body>
